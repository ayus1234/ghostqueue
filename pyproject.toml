[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostqueue"
version = "0.1.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "boto3>=1.34.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pyright]
extraPaths = [
  "backend",
  "C:/Users/hp/.venv/Lib/site-packages",
  "C:/Python313/Lib/site-packages",
  "C:/Python312/Lib/site-packages"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
